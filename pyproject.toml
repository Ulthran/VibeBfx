[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibebfx"
version = "0.1.0"
description = "DeepAgents-powered bioinformatics workflow orchestration library built on LangChain"
readme = "README.md"
authors = [{name = "VibeBfx Team"}]
requires-python = ">=3.10"
dependencies = [
  "langchain>=1.1,<2.0",
  "langchain-community>=0.3",
  "langchain-openai>=0.2.7",
  "langgraph>=0.2.0",
  "deepagents>=0.2,<0.3",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
bio = [
  "pandas>=2.2",
  "numpy>=1.26",
  "plotly>=5.22",
]

test = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
]

[project.scripts]
vibe-bfx = "vibebfx.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"
